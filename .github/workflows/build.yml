# Builds UniFetcher on every push so you can see straight away if something broke.
# The installer, portable zip and extensions are attached to each run as "artifacts"
# (open the run on the Actions tab and scroll down to download them).
name: Build
on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PROJECT_NAME: Nickvision.Parabolic.WinUI
jobs:
  build:
    name: "Build (x64)"
    runs-on: windows-2025-vs2026
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.0.0-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gettext-tools
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: "Set up tools"
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: "Build app"
        shell: pwsh
        run: |
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vsInstallPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsInstallPath -SkipAutomaticLocation
          dotnet restore ${{ env.PROJECT_NAME }} --runtime win-x64 /p:PublishReadyToRun=true
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet publish ${{ env.PROJECT_NAME }} -c Release --no-restore --runtime win-x64 /p:Platform=x64 /p:Version=$("${{ env.VERSION }}".Split('-')[0]) /p:InformationalVersion=${{ env.VERSION }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Helper the browser extension talks to; it goes next to UniFetcher.exe
          dotnet publish UniFetcher.NativeHost -c Release --runtime win-x64 -o "${{ env.PROJECT_NAME }}/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/publish"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: "Package installer, portable zip and extensions"
        shell: pwsh
        run: scripts/package.ps1 -Arch x64 -Version ${{ env.VERSION }} -ExtensionVersion 0.0.0.${{ github.run_number }} -PublishDir "${{ env.PROJECT_NAME }}/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/publish" -OutDir out
      - uses: actions/upload-artifact@v4
        with:
          name: UniFetcher-${{ env.VERSION }}-x64
          path: out/*
      - name: "Start-up test: install, open, close, open again"
        # Catches "UniFetcher doesn't open" problems that a successful build can't show.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $setup = Get-ChildItem out -Filter "*Setup-x64.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$env:RUNNER_TEMP\install.log" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\UniFetcher\Release\UniFetcher.exe"
          $data = Join-Path $env:LOCALAPPDATA "UniFetcher"
          if (-not (Test-Path $exe)) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 40; echo "::error title=Installer::UniFetcher.exe was not installed to $exe"; exit 1 }
          function Annotate($title, $lines) {
            if ($lines) { $text = ($lines | Select-Object -Last 40) -join "%0A"; echo "::warning title=$title::$text" }
          }
          function Show-Logs {
            Annotate "crash.log" (Get-Content (Join-Path $data "crash.log") -ErrorAction SilentlyContinue)
            Annotate "app.log (errors)" (Get-Content (Join-Path $data "app.log") -ErrorAction SilentlyContinue | Select-String -Pattern "fail|crit|error|exception|   at " | ForEach-Object { $_.Line })
            Annotate "Windows events" (Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in 'Application Error','.NET Runtime' } | Select-Object -First 3 | ForEach-Object { $_.Message -split "`r?`n" })
            foreach ($f in "app.log", "crash.log") {
              $p = Join-Path $data $f
              if (Test-Path $p) { echo "----- $f -----"; Get-Content $p -Tail 60 }
            }
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in 'Application Error','.NET Runtime','Windows Error Reporting' } |
              Select-Object -First 5 | ForEach-Object { echo "----- Windows event: $($_.ProviderName) -----"; $_.Message }
          }
          $failed = $false
          foreach ($round in 1, 2, 3) {
            $p = Start-Process $exe -PassThru
            Start-Sleep -Seconds 25
            if ($p.HasExited) {
              echo "::error title=UniFetcher crashed on start (round $round)::Exit code $($p.ExitCode). See the log below."
              Show-Logs; $failed = $true; break
            }
            echo "Round ${round}: UniFetcher is running."
            $null = $p.CloseMainWindow()
            if (-not $p.WaitForExit(30000)) {
              echo "::error title=UniFetcher kept running after closing (round $round)::The process was still alive 30 s after its window was closed."
              Show-Logs; $p.Kill($true); $failed = $true; break
            }
            echo "Round ${round}: UniFetcher closed properly."
            if (Get-Process UniFetcher -ErrorAction SilentlyContinue) {
              echo "::error title=UniFetcher left a background process (round $round)::"
              $failed = $true; break
            }
          }
          Show-Logs
          if ($failed) { exit 1 }
